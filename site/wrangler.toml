# Cloudflare Worker configuration — used both by `npm run preview:cf` locally
# and by Cloudflare's own build pipeline on deploy.
#
# This project is a **Worker with static assets**, not a Pages project. See the
# header comment in `src/worker.ts` for what that changes, and
# `docs/18-staging-and-deployment.md` for the deploy settings that go with it.
#
# `name` MUST match the Cloudflare project slug exactly, or a deploy will
# create a second, empty project rather than updating this one.
#
# Secrets never go here. Locally they live in `.dev.vars` (gitignored, see
# `.dev.vars.example`); in production they are set on the Worker in the
# Cloudflare dashboard.
name = "nikkostudio"
main = "src/worker.ts"
compatibility_date = "2026-08-21"

# Plain runtime variables. These belong HERE rather than in the dashboard:
# `wrangler deploy` replaces the Worker's configuration with this file, so a
# plain variable added through the dashboard is removed by the next deploy.
# (Encrypted secrets are stored separately and survive — which is why
# RESEND_API_KEY kept working when these two silently disappeared.)
#
# Only non-secret values go here. RESEND_API_KEY, ENQUIRY_IP_SALT and
# ENQUIRY_NOTIFY_TO stay dashboard secrets: the first two are credentials,
# and the third is a private inbox that does not belong in a git history.
[vars]
# The From: on both emails. Public by definition — it is printed in every
# message. Resend's shared sender until nikkostudio.co is verified there;
# note it only delivers to the Resend account's own address, so a test to
# any other inbox will report success and arrive nowhere. Swap this to
# "Nikko Studio <hello@nikkostudio.co>" the day the domain is verified.
ENQUIRY_FROM = "Nikko Studio <onboarding@resend.dev>"

# The built Astro site. `binding` is what makes `env.ASSETS` exist in
# `src/worker.ts`; without it the Worker has no way to serve a file.
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 is not provisioned yet (docs/17 F1). Once it is, uncomment and fill in
# database_id from `wrangler d1 create nikko-enquiries`, and add the same
# binding to the Worker in the Cloudflare dashboard.
# [[d1_databases]]
# binding = "DB"
# database_name = "nikko-enquiries"
# database_id = "<from `wrangler d1 create`>"
