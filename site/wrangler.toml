# Cloudflare Worker configuration — used both by `npm run preview:cf` locally
# and by Cloudflare's own build pipeline on deploy.
#
# This project is a **Worker with static assets**, not a Pages project. See the
# header comment in `src/worker.ts` for what that changes, and
# `docs/18-staging-and-deployment.md` for the deploy settings that go with it.
#
# `name` MUST match the Cloudflare project slug exactly, or a deploy will
# create a second, empty project rather than updating this one.
#
# Secrets never go here. Locally they live in `.dev.vars` (gitignored, see
# `.dev.vars.example`); in production they are set on the Worker in the
# Cloudflare dashboard.
name = "nikkostudio"
main = "src/worker.ts"
compatibility_date = "2026-08-21"

# NO [vars] BLOCK, DELIBERATELY. Every runtime value this Worker reads —
# RESEND_API_KEY, ENQUIRY_NOTIFY_TO, ENQUIRY_FROM, ENQUIRY_IP_SALT — is a
# dashboard SECRET, not a config entry here.
#
# The reason is a trap worth knowing about: `wrangler deploy` replaces the
# Worker's configuration with this file, so a plain variable added through
# the dashboard is silently removed by the next deploy. Secrets are stored
# separately and survive. Putting values here instead would fix that, but at
# the cost of needing a code change and a deploy to alter a sender address,
# which is the founder's call to make and not an engineer's — so secrets it
# is, on both counts.
#
# If a value ever goes missing again, the enquiry row's `notify_state`
# column names which one and why.

# The built Astro site. `binding` is what makes `env.ASSETS` exist in
# `src/worker.ts`; without it the Worker has no way to serve a file.
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 is not provisioned yet (docs/17 F1). Once it is, uncomment and fill in
# database_id from `wrangler d1 create nikko-enquiries`, and add the same
# binding to the Worker in the Cloudflare dashboard.
# [[d1_databases]]
# binding = "DB"
# database_name = "nikko-enquiries"
# database_id = "<from `wrangler d1 create`>"
