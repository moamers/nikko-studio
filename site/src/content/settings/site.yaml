# ─────────────────────────────────────────────────────────────
#  SITE SETTINGS — the name, the description search engines and
#  language models read, the header navigation, the small words
#  on the header's own controls, and the footer link columns.
#
#  Edit the text between the quotes. Keep the labels on the left
#  exactly as they are.
# ─────────────────────────────────────────────────────────────

title: "Nikko Studio"
tagline: "Story-led Marketing for Memorability"

# Kept under 160 characters so search engines and language models get the
# whole sentence rather than an ellipsis. The build enforces it.
description: >
  A creative story studio in London and the UAE. Nikko markets for
  memorability, so when it's time to buy or book, you're the only one in mind.

locale: "en-GB"

# ── The header navigation ────────────────────────────────────
# These are the links across the top of the page, in this order.
nav:
  - label: "The work"
    href: "#work"
  - label: "Put us to work"
    href: "#services"
  - label: "Founder"
    href: "#founder"

# The button at the right of the header, and in the mobile menu.
cta:
  label: "Pitch your project"
  href: "/contact"

logo:
  wordmark: "Nikko"
  homeLabel: "Nikko Studio — back to the top"
  homeHref: "#top"

# ── The header's own small words ─────────────────────────────
header:
  # Offered to keyboard readers first, before the opening sequence.
  skipLink: "Skip to content"
  # The name a screen reader announces for the navigation itself.
  navLabel: "Primary"
  # On phones and small tablets the navigation folds into a menu.
  menuOpen: "Menu"
  menuClose: "Close"
  menuLabel: "Site menu"

# ── The analogue / digital dial ──────────────────────────────
# The little bordered button beside the menu. The site drifts from
# "analogue" (warm, grainy) to "digital" (crisp, cool) as you scroll,
# and clicking the dial pins whichever you prefer.
#
# The tooltip is built from two halves: one of the two "note" lines
# about pinning, followed by one of the two mood lines.
modeDial:
  analogue: "Analogue"
  digital: "Digital"
  auto: "Auto"
  noteAnalogue: "grain · signal · warmth"
  noteDigital: "crisp · flat · cobalt"
  noteAuto: "Drifting with your scroll — click to pin. "
  notePinned: "Pinned — click to switch. "

# ── The footer's three link columns ──────────────────────────
# An item with an "href" becomes a link. An item without one is
# just a line of text.
footerColumns:
  - title: "About"
    items:
      - label: "London-based 🇬🇧"
      - label: "Lebanese bread 🫓"
  - title: "Follow"
    items:
      - label: "Threads"
        href: "https://www.threads.com/@im.nadia.amer"
      - label: "Substack"
        href: "https://substack.com/@itsnadiaamer"
  - title: "Legal"
    items:
      - label: "Privacy Policy"
        href: "/privacy-policy"
      - label: "Terms & Conditions"
        href: "/terms-and-conditions"
