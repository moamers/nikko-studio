# ─────────────────────────────────────────────────────────────────────
#  TRANSACTIONAL EMAIL COPY — the words in the two enquiry-form emails
#  (the "brief received" email a customer gets, and the notification
#  Nadia gets).
#
#  This file is yours. Reword any sentence below and both emails pick
#  it up the next time the site builds (about two minutes). You do not
#  need an engineer.
#
#  A few things worth knowing before you edit:
#
#  • Keep the indentation exactly as you find it.
#  • If your text contains a colon followed by a space, or starts with
#    a quote, wrap the whole thing in "double quotes".
#  • `{name}` in customer.greeting is replaced with the enquirer's
#    first name automatically. Don't remove the braces.
#  • Do not add arrow icons (→, ➔, ➺) to any line — the approved
#    design keeps links plain. [instruction from Nadia, 2026-08-21]
#
#  Design source: nikko-email-handoff-direction-01 ("Direction 01 —
#  restrained editorial receipt"), approved 2026-08-21.
# ─────────────────────────────────────────────────────────────────────

brand:
  name: "NIKKO STUDIO"
  locations: "LONDON // DUBAI"
  # CORRECTED from the supplied design package, which read
  # "NIKKO STUDIO // LONDON // DUBAI" (double slash). The site's own
  # verbatim masthead — the corner note in the homepage's opening
  # sequence, `src/components/OpeningSequence.astro` — reads
  # "A story studio / London / Dubai": a SINGLE forward slash with one
  # space either side. That is the site's one existing precedent for
  # this exact "NAME / PLACE / PLACE" construction, so the email
  # masthead now matches it rather than inventing its own separator.
  masthead: "NIKKO STUDIO / LONDON / DUBAI"
  website_label: "NIKKOSTUDIO.CO"

