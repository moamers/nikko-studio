    - >
      As we wrap up the first phase of this project together, where we've
      almost doubled the launch revenue…and the launch itself has felt like a
      walk in the park vs a meltdown-a-minute, I have never felt so excited,
      nay — GIDDY — about my own business as I do right now.”
  authorName: "— Maddi Cook,"
  authorRole: "Founder of Maddi Cook Coaching"
