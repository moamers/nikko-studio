# ─────────────────────────────────────────────────────────────
#  WORK SAMPLER + TESTIMONIAL
#
#  The sampler shows one line at a time, like a slide pulled at
#  random from a carousel. All eight are written into the page,
#  so search engines and AI assistants see every one of them —
#  do not be tempted to trim the list to the one on screen.
# ─────────────────────────────────────────────────────────────

heading: "Turns out our work travels well"

# {n} is replaced by the number of the line currently showing.
status: "Pulling one at random — no. {n} of far too many"
pullLabel: "Pull another →"

fragments:
