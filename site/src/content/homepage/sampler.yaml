    text: "A manifesto that gave a room full of businesses their spine back."
  - tag: "UAE / MEMBERSHIP"
    text: "Membership journeys for a talent agency — 215,000 members deep."
  - tag: "INBOX / LETTERS"
    text: "Newsletters thousands of people actually open on a Tuesday."
