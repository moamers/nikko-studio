<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket Game</title>
<style>
  body { margin: 0; background: #05061a; overflow: hidden; font-family: sans-serif; color: white; user-select: none; }
  #space { position: relative; width: 100vw; height: 100vh; touch-action: none; overflow: hidden;
           background: radial-gradient(ellipse at 20% 25%, #4a2f8a44, transparent 60%),
                       radial-gradient(ellipse at 80% 75%, #1b6aa033, transparent 55%); }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .thing, #rocket, .planet, #moon { position: absolute; pointer-events: none; background-size: contain; background-repeat: no-repeat; background-position: center; }
  .thing, #rocket { z-index: 3; }
  .planet { z-index: 1; }
  #moon { top: 40px; left: 50%; transform: translateX(-50%); z-index: 1; display: none; }
  #hud { position: absolute; top: 8px; left: 0; width: 100%; text-align: center; font-size: 22px; z-index: 5; pointer-events: none; text-shadow: 0 0 6px #000; }
  #bar { position: absolute; top: 46px; left: 20%; width: 60%; height: 8px; background: #ffffff33; border-radius: 6px; z-index: 5; }
  #fill { height: 100%; width: 0; background: #ffd23f; border-radius: 6px; }
  #message { position: absolute; top: 26%; width: 100%; text-align: center; font-size: 34px; z-index: 6; line-height: 1.4; text-shadow: 0 0 10px #000; }
  #banner { position: absolute; top: 20%; width: 100%; text-align: center; font-size: 56px; z-index: 6; pointer-events: none; display: none; text-shadow: 0 0 12px #000; }
  button { font-size: 22px; padding: 10px 22px; border-radius: 14px; border: none; cursor: pointer; margin-top: 12px; }
  #topButtons { position: fixed; top: 8px; right: 8px; z-index: 7; display: flex; flex-direction: column; gap: 4px; }
  #topButtons button { font-size: 16px; margin: 0; padding: 8px 12px; }
  #boost { position: fixed; bottom: 20px; right: 20px; z-index: 7; font-size: 26px; padding: 18px 26px; background: #ff7a00; color: white; font-weight: bold; }
  #boost.cooling { background: #666; }
  #boost.on { background: #ffd23f; color: #222; }
  #shieldBtn { position: fixed; bottom: 20px; left: 20px; z-index: 7; font-size: 26px; padding: 18px 26px; margin: 0; background: #1e90ff; color: white; font-weight: bold; }
  #shieldBtn.cooling { background: #666; }
  #shieldBtn.on { background: #7fe9ff; color: #06283d; }
  #shield { position: absolute; z-index: 4; pointer-events: none; display: none; border-radius: 50%;
            background: radial-gradient(circle, rgba(80,200,255,0.06) 55%, rgba(80,200,255,0.35) 68%, rgba(190,245,255,0.9) 71%, rgba(80,200,255,0) 74%);
            box-shadow: 0 0 30px 6px rgba(80,200,255,0.35); }
  #map { position: fixed; inset: 0; z-index: 9; background: #05061af0; display: none; text-align: center; padding-top: 12vh; }
  #track { position: relative; width: 80%; height: 8px; background: #ffffff55; margin: 90px auto 70px; border-radius: 4px; }
  .mark { position: absolute; top: -52px; transform: translateX(-50%); }
  .mark img { width: 44px; height: 44px; display: block; margin: 0 auto; }
  .mark small { display: block; font-size: 13px; margin-top: 6px; white-space: nowrap; position: relative; top: 24px; }
  #me { position: absolute; top: 14px; width: 48px; height: 48px; transform: translateX(-50%) rotate(90deg); }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10; display: none; touch-action: none; background: #000; }
  #sceneHud { position: fixed; top: 8px; left: 0; width: 100%; text-align: center; font-size: 20px; z-index: 11; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 3px #000; display: none; padding: 0 12px; box-sizing: border-box; }
  #sceneToast { position: fixed; top: 22%; left: 0; width: 100%; text-align: center; font-size: 38px; z-index: 11; pointer-events: none; text-shadow: 0 0 10px #000; display: none; }
  #sceneMsg { position: fixed; inset: 0; z-index: 12; background: #000000b8; display: none; align-items: center; justify-content: center; text-align: center; font-size: 32px; line-height: 1.4; padding: 20px; }
  #landBtn { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 7; display: none; background: #2ecc71; color: #052a14; font-weight: bold; font-size: 24px; margin: 0; padding: 12px 24px; }
  #landBtn img { width: 36px; height: 36px; vertical-align: middle; margin-right: 8px; }
  body.scene #space, body.scene #topButtons, body.scene #boost, body.scene #shieldBtn, body.scene #landBtn, body.scene #map { display: none !important; }
  body.scene #world, body.scene #sceneHud { display: block; }
  body:not(.scene) #sceneToast { display: none !important; }
</style>
</head>
<body>
<div id="space">
  <canvas id="stars"></canvas>
  <div id="moon"></div>
  <div id="hud"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="banner"></div>
  <div id="message"></div>
  <div id="rocket"></div>
  <div id="shield"></div>
</div>
<canvas id="world"></canvas>
<div id="sceneHud"></div>
<div id="sceneToast"></div>
<div id="sceneMsg"></div>
<button id="landBtn"></button>
<div id="topButtons">
  <button id="mapBtn">Map (M)</button>
  <button id="easyBtn">Easy: OFF (E)</button>
</div>
<button id="boost">BOOST (B)</button>
<button id="shieldBtn">SHIELD (S)</button>
<div id="map">
  <h1>Map to the Moon</h1>
  <div id="track"></div>
  <h2 id="mapText"></h2>
  <button id="mapClose">Back to flying!</button>
</div>

<script>
// =====================================================
//  SETTINGS  -  CHANGE THESE AND REFRESH THE PAGE!
// =====================================================
const ROCKET_NAME    = "Zoom";    // Name your rocket! Put any name in the quotes.
const ROCKET_COLOUR  = "#d62828"; // Nose and fins. Try "blue" or "#00cc66" or "gold"
const ALIEN_COLOUR   = "#7CFC00"; // Skin of the alien pilots. Try "purple" or "pink"
const ROCKET_SIZE    = 100;       // How big the rocket is. Try 160!
const ROCKET_SPEED   = 14;        // Arrow-key speed at Level 1. Try 25 for SUPER fast!
const SPACE_COLOUR   = "#05061a"; // Try "#0a0030" or "#001a2e"

// ---- The story: house, car, NASA, rocket, planets, Moon, home ----
const PLAYER_SPEED   = 5;         // How fast you walk. Try 10!
const PLAYER_SHIRT   = "#2a9d8f"; // Your shirt colour. Try "orange" or "purple"
const CAR_COLOUR     = "#e63946"; // Your car's colour. Try "gold" or "blue"
const DRIVE_SECONDS  = 18;        // How long each car ride takes. Try 40 for a LONG drive!
const CRYSTAL_SCORE  = 50;        // Score for each crystal or rock you find on a planet
const RETURN_LEVELS  = 2;         // How many levels on the flight home
const RETURN_SECONDS_PER_LEVEL = 12;
const GARAGE_BIG_SCORE = 1000;    // Score you need to park one level higher in the 5-level parking lot

// ---- The journey to the Moon ----
const LEVELS            = 5;      // How many levels before the Moon. Try 10!
const SECONDS_PER_LEVEL = 25;     // How long each level takes. Try 10 for a quick game!
const LEVEL_SPEEDUP     = 0.35;   // Rocket gets this much faster every level (0.35 = 35%)
const HARDER_PER_LEVEL  = 0.25;   // Rocks and aliens get this much tougher every level
const MOON_KM           = 384400; // The REAL distance from Earth to the Moon, in kilometres!

// ---- Boost ----
const BOOST_POWER    = 2.5;       // How much faster boost makes you go. Try 5!
const BOOST_TIME     = 1500;      // How long boost lasts (1000 = 1 second)
const BOOST_COOLDOWN = 6000;      // How long you wait before you can boost again

// ---- Shield: rocks and aliens bounce off, no damage! ----
const SHIELD_TIME     = 15000;    // How long the shield lasts (15000 = 15 seconds)
const SHIELD_COOLDOWN = 30000;    // How long you wait before you can use it again. Try 5000!

// ---- Danger ----
const START_LIVES    = 4;         // How many hull blocks you start with
const ROCK_SPEED     = 7;         // How fast rocks fall. Try 12 if you're brave!
const ROCK_DAMAGE    = 3;         // Hull blocks a rock takes away. Try 1 for easier!
const ROCK_EVERY     = 350;       // Milliseconds between rocks. Smaller = MORE rocks!
const ALIEN_EVERY    = 2800;      // How often alien ships appear. Smaller = MORE aliens!
const ALIEN_SPEED    = 1.8;       // Alien ships CHASE you at this speed (gentle!). Try 4 for mean aliens!
const BULLET_SPEED   = 10;

// ---- Easy button ----
const EASY_LIVES     = 10;        // Hull blocks you get in easy mode
const EASY_DAMAGE    = 1;         // Rocks only take 1 block in easy mode
const EASY_SLOWER    = 0.6;       // Rocks and aliens move at 60% speed in easy mode
const EASY_FEWER     = 1.8;       // Rocks and aliens come 1.8x less often in easy mode

// ---- Score ----
const STAR_EVERY     = 1600;      // How often stars appear
const STAR_SCORE     = 10;        // Score for grabbing a star
const ALIEN_SCORE    = 30;        // Score for shooting an alien
const LEVEL_SCORE    = 100;       // Score for finishing a level

// =====================================================
//  THE PICTURES  -  we DRAW everything with code!
//  Each function below paints one picture on a tiny
//  invisible canvas. Later we use that picture in the game.
// =====================================================
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }   // same "random" every time

function drawRocket(flame) {
  const c = makeCanvas(200, 200), g = c.getContext("2d");
  if (flame > 0) {                                   // fire!
    const fg = g.createLinearGradient(0, 158, 0, 158 + flame);
    fg.addColorStop(0, "#fffbe0"); fg.addColorStop(0.35, "#ffb02e"); fg.addColorStop(1, "rgba(255,80,0,0)");
    g.fillStyle = fg;
    g.beginPath(); g.moveTo(86, 158); g.quadraticCurveTo(100, 158 + flame * 1.8, 114, 158); g.closePath(); g.fill();
  }
  g.fillStyle = ROCKET_COLOUR; g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = 1.5;   // fins
  g.beginPath(); g.moveTo(72, 105); g.lineTo(44, 158); g.lineTo(72, 150); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(128, 105); g.lineTo(156, 158); g.lineTo(128, 150); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = "#3a3f46";                           // engine nozzle
  g.beginPath(); g.moveTo(84, 150); g.lineTo(116, 150); g.lineTo(110, 165); g.lineTo(90, 165); g.closePath(); g.fill();
  const bg = g.createLinearGradient(70, 0, 130, 0);  // metal body
  bg.addColorStop(0, "#8a939e"); bg.addColorStop(0.3, "#ffffff"); bg.addColorStop(0.7, "#dfe5ea"); bg.addColorStop(1, "#6f7883");
  g.beginPath(); g.moveTo(100, 6); g.bezierCurveTo(132, 40, 135, 95, 130, 152);
  g.lineTo(70, 152); g.bezierCurveTo(65, 95, 68, 40, 100, 6); g.closePath();
  g.fillStyle = bg; g.fill(); g.stroke();
  g.save(); g.clip();                                // coloured nose and stripe
  g.fillStyle = ROCKET_COLOUR; g.fillRect(60, 0, 80, 52); g.fillRect(60, 108, 80, 9);
  const sh = g.createLinearGradient(70, 0, 130, 0);
  sh.addColorStop(0, "rgba(0,0,0,0.35)"); sh.addColorStop(0.3, "rgba(255,255,255,0.35)"); sh.addColorStop(1, "rgba(0,0,0,0.4)");
  g.fillStyle = sh; g.fillRect(60, 0, 80, 160);
  g.restore();
  g.beginPath(); g.arc(100, 78, 16, 0, 7); g.fillStyle = "#3b4651"; g.fill();   // window
  const wg = g.createRadialGradient(95, 72, 1, 100, 78, 13);
  wg.addColorStop(0, "#d9f1ff"); wg.addColorStop(1, "#1b5e9e");
  g.beginPath(); g.arc(100, 78, 12, 0, 7); g.fillStyle = wg; g.fill();
  g.fillStyle = "rgba(255,255,255,0.7)"; g.beginPath(); g.ellipse(96, 72, 4, 2.5, -0.6, 0, 7); g.fill();
  return c.toDataURL();
}

function drawRock(seed) {
  const R = rng(seed), c = makeCanvas(100, 100), g = c.getContext("2d");
  const n = 11, pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + R() * 0.3, r = 31 + R() * 15;
    pts.push([50 + Math.cos(a) * r, 50 + Math.sin(a) * r]);
  }
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
  const rg = g.createRadialGradient(36, 34, 4, 50, 50, 56);
  rg.addColorStop(0, "#c2b8ac"); rg.addColorStop(0.55, "#7a7168"); rg.addColorStop(1, "#27231f");
  g.fillStyle = rg; g.fill();
  g.save(); g.clip();
  for (let i = 0; i < 4; i++) {                      // craters
    const cx = 28 + R() * 44, cy = 28 + R() * 44, cr = 5 + R() * 8;
    g.fillStyle = "rgba(0,0,0,0.28)"; g.beginPath(); g.arc(cx, cy, cr, 0, 7); g.fill();
    g.strokeStyle = "rgba(255,255,255,0.2)"; g.lineWidth = 1.5; g.beginPath(); g.arc(cx + 1, cy + 1, cr, 0.2, 2.4); g.stroke();
  }
  g.restore();
  g.strokeStyle = "rgba(0,0,0,0.55)"; g.lineWidth = 1.5;
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.stroke();
  return c.toDataURL();
}

function drawAlien() {   // an alien flying saucer
  const c = makeCanvas(100, 100), g = c.getContext("2d");
  const glow = g.createRadialGradient(50, 72, 2, 50, 72, 30);
  glow.addColorStop(0, "rgba(130,255,160,0.5)"); glow.addColorStop(1, "rgba(130,255,160,0)");
  g.fillStyle = glow; g.fillRect(0, 40, 100, 60);
  const dg = g.createRadialGradient(42, 30, 2, 50, 44, 26);        // glass dome
  dg.addColorStop(0, "rgba(220,255,235,0.9)"); dg.addColorStop(1, "rgba(90,200,150,0.55)");
  g.fillStyle = dg; g.beginPath(); g.ellipse(50, 48, 19, 22, 0, Math.PI, 0); g.closePath(); g.fill();
  g.fillStyle = ALIEN_COLOUR; g.beginPath(); g.ellipse(50, 42, 9, 11, 0, 0, 7); g.fill();   // alien head
  g.fillStyle = "#050505";
  g.beginPath(); g.ellipse(46, 41, 3.2, 1.8, 0.5, 0, 7); g.fill();
  g.beginPath(); g.ellipse(54, 41, 3.2, 1.8, -0.5, 0, 7); g.fill();
  const hg = g.createLinearGradient(0, 50, 0, 72);                // metal body
  hg.addColorStop(0, "#e3e8ee"); hg.addColorStop(0.5, "#8f99a5"); hg.addColorStop(1, "#4a525c");
  g.fillStyle = hg; g.strokeStyle = "rgba(0,0,0,0.5)"; g.lineWidth = 1.5;
  g.beginPath(); g.ellipse(50, 58, 44, 13, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = "rgba(255,255,255,0.25)"; g.beginPath(); g.ellipse(50, 54, 38, 6, 0, 0, 7); g.fill();
  ["#ff4d4d", "#ffd23f", "#4dd2ff", "#ffd23f", "#ff4d4d"].forEach((col, i) => {   // lights
    const lx = 18 + i * 16, ly = 62 + Math.sin(i / 4 * Math.PI) * 2;
    g.shadowColor = col; g.shadowBlur = 6; g.fillStyle = col; g.beginPath(); g.arc(lx, ly, 3, 0, 7); g.fill();
  });
  return c.toDataURL();
}

function drawStar() {   // a glowing power star
  const c = makeCanvas(100, 100), g = c.getContext("2d");
  const gl = g.createRadialGradient(50, 50, 4, 50, 50, 48);
  gl.addColorStop(0, "rgba(255,225,90,0.7)"); gl.addColorStop(1, "rgba(255,200,40,0)");
  g.fillStyle = gl; g.fillRect(0, 0, 100, 100);
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 13 : 30;
    g.lineTo(50 + Math.cos(a) * r, 50 + Math.sin(a) * r);
  }
  g.closePath();
  const sg = g.createRadialGradient(44, 42, 2, 50, 50, 32);
  sg.addColorStop(0, "#fffbc4"); sg.addColorStop(1, "#ffa800");
  g.fillStyle = sg; g.fill(); g.strokeStyle = "#ff8c00"; g.lineWidth = 2; g.stroke();
  return c.toDataURL();
}

function drawBolt() {   // a laser bolt
  const c = makeCanvas(40, 100), g = c.getContext("2d");
  g.shadowColor = "#ff7a00"; g.shadowBlur = 14;
  const bg = g.createLinearGradient(14, 0, 26, 0);
  bg.addColorStop(0, "#ff6a00"); bg.addColorStop(0.5, "#ffffff"); bg.addColorStop(1, "#ff6a00");
  g.fillStyle = bg; g.beginPath(); g.roundRect(14, 12, 12, 76, 6); g.fill();
  return c.toDataURL();
}

// Planet shading: light comes from the top-left, dark edge on the bottom-right
function shade(g, cx, cy, r) {
  const sg = g.createRadialGradient(cx - r * 0.4, cy - r * 0.4, r * 0.1, cx, cy, r * 1.05);
  sg.addColorStop(0, "rgba(255,255,255,0.28)"); sg.addColorStop(0.45, "rgba(255,255,255,0)"); sg.addColorStop(1, "rgba(0,0,0,0.72)");
  g.fillStyle = sg; g.fillRect(cx - r, cy - r, r * 2, r * 2);
}

function drawPlanet(type, seed) {   // 0 = ringed gas giant, 1 = red planet, 2 = blue planet, 3 = purple ice giant
  const R = rng(seed), c = makeCanvas(300, 300), g = c.getContext("2d");
  const cx = 150, cy = 150, r = type === 0 ? 85 : 100;
  const ring = (a, b) => {
    [[1.6, 0.38, 14, "rgba(224,202,160,0.9)"], [1.33, 0.31, 6, "rgba(140,120,92,0.85)"]].forEach(s => {
      g.strokeStyle = s[3]; g.lineWidth = s[2];
      g.beginPath(); g.ellipse(cx, cy, r * s[0], r * s[1], -0.35, a, b); g.stroke();
    });
  };
  if (type === 0) ring(Math.PI, Math.PI * 2);     // back of the ring
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.clip();
  if (type === 0) {
    g.fillStyle = "#d9b27c"; g.fillRect(0, 0, 300, 300);
    for (let i = 0; i < 12; i++) {
      g.fillStyle = i % 2 ? "rgba(150,100,60,0.4)" : "rgba(255,235,200,0.3)";
      g.fillRect(0, cy - r + i * (2 * r / 12), 300, (2 * r / 12) * (0.5 + R() * 0.8));
    }
  } else if (type === 1) {
    g.fillStyle = "#b5482b"; g.fillRect(0, 0, 300, 300);
    for (let i = 0; i < 34; i++) {
      g.fillStyle = R() > 0.5 ? "rgba(110,35,18,0.4)" : "rgba(235,160,110,0.3)";
      g.beginPath(); g.ellipse(cx - r + R() * 2 * r, cy - r + R() * 2 * r, 8 + R() * 26, 5 + R() * 14, R() * 3, 0, 7); g.fill();
    }
    g.fillStyle = "rgba(255,255,255,0.85)"; g.beginPath(); g.ellipse(cx, cy - r, 55, 18, 0, 0, 7); g.fill();
  } else if (type === 2) {
    g.fillStyle = "#1f5fa8"; g.fillRect(0, 0, 300, 300);
    for (let i = 0; i < 9; i++) {
      const bx = cx - r + R() * 2 * r, by = cy - r + R() * 2 * r;
      g.fillStyle = R() > 0.3 ? "#4a8f4e" : "#8a7a4a";
      for (let j = 0; j < 5; j++) { g.beginPath(); g.arc(bx + (R() - 0.5) * 36, by + (R() - 0.5) * 26, 8 + R() * 14, 0, 7); g.fill(); }
    }
    for (let i = 0; i < 16; i++) {
      g.fillStyle = "rgba(255,255,255,0.55)";
      g.beginPath(); g.ellipse(cx - r + R() * 2 * r, cy - r + R() * 2 * r, 18 + R() * 30, 3 + R() * 5, (R() - 0.5) * 0.6, 0, 7); g.fill();
    }
  } else {
    g.fillStyle = "#7a5bd0"; g.fillRect(0, 0, 300, 300);
    for (let i = 0; i < 9; i++) {
      g.fillStyle = i % 2 ? "rgba(190,170,255,0.35)" : "rgba(60,30,130,0.3)";
      g.fillRect(0, cy - r + i * (2 * r / 9), 300, (2 * r / 9) * (0.4 + R() * 0.7));
    }
  }
  shade(g, cx, cy, r);
  g.restore();
  g.strokeStyle = type === 2 ? "rgba(150,205,255,0.55)" : "rgba(255,255,255,0.14)"; g.lineWidth = 3;
  g.beginPath(); g.arc(cx, cy, r - 1, 0, 7); g.stroke();
  if (type === 0) ring(0, Math.PI);                // front of the ring
  return c.toDataURL();
}

function drawMoon() {
  const R = rng(77), c = makeCanvas(300, 300), g = c.getContext("2d"), cx = 150, cy = 150, r = 130;
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.clip();
  const bg = g.createRadialGradient(cx - 40, cy - 40, 10, cx, cy, r);
  bg.addColorStop(0, "#e6e6e1"); bg.addColorStop(1, "#8d8d88");
  g.fillStyle = bg; g.fillRect(0, 0, 300, 300);
  for (let i = 0; i < 6; i++) {                    // dark "seas"
    g.fillStyle = "rgba(70,70,72,0.35)";
    g.beginPath(); g.ellipse(cx - r * 0.7 + R() * r * 1.4, cy - r * 0.7 + R() * r * 1.4, 25 + R() * 35, 18 + R() * 28, R() * 3, 0, 7); g.fill();
  }
  for (let i = 0; i < 40; i++) {                   // craters
    const px = cx - r + R() * 2 * r, py = cy - r + R() * 2 * r, pr = 3 + R() * 14;
    g.fillStyle = "rgba(60,60,62,0.3)"; g.beginPath(); g.arc(px, py, pr, 0, 7); g.fill();
    g.strokeStyle = "rgba(255,255,255,0.3)"; g.lineWidth = 1.5; g.beginPath(); g.arc(px + 1, py + 1, pr, 0.3, 2.5); g.stroke();
  }
  shade(g, cx, cy, r);
  g.restore();
  return c.toDataURL();
}

function drawStation() {   // a little satellite for the map
  const c = makeCanvas(100, 100), g = c.getContext("2d");
  [[4, 40], [66, 40]].forEach(p => {
    g.fillStyle = "#1d3f7a"; g.fillRect(p[0], p[1], 30, 20);
    g.strokeStyle = "rgba(140,185,240,0.7)"; g.lineWidth = 1;
    for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(p[0] + i * 6, p[1]); g.lineTo(p[0] + i * 6, p[1] + 20); g.stroke(); }
    g.strokeRect(p[0], p[1], 30, 20);
  });
  g.fillStyle = "#d9b44a"; g.fillRect(36, 36, 28, 28);
  g.strokeStyle = "#7a6320"; g.lineWidth = 2; g.strokeRect(36, 36, 28, 28);
  g.fillStyle = "#e8e8e8"; g.fillRect(48, 22, 4, 14);
  g.beginPath(); g.arc(50, 20, 4, 0, 7); g.fill();
  return c.toDataURL();
}

// ----- the person (a boy or girl seen from above) -----
function inputDir() {
  let dx = 0, dy = 0;
  if (keys["ArrowLeft"]  || keys["a"] || keys["A"]) dx -= 1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += 1;
  if (keys["ArrowUp"]    || keys["w"] || keys["W"]) dy -= 1;
  if (keys["ArrowDown"]  || keys["s"] || keys["S"]) dy += 1;
  if (!dx && !dy && ptr.down) {                        // touch and hold: walk toward your finger
    const ddx = ptr.x - P.x, ddy = ptr.y - P.y, d = Math.hypot(ddx, ddy);
    if (d > 12) { dx = ddx / d; dy = ddy / d; }
  }
  const m = Math.hypot(dx, dy);
  return m ? { dx: dx / m, dy: dy / m } : { dx: 0, dy: 0 };
}
function circleHitsRect(cx, cy, r, w) {
  const nx = Math.max(w.x, Math.min(cx, w.x + w.w)), ny = Math.max(w.y, Math.min(cy, w.y + w.h));
  return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
}
function movePlayer(k, walls) {
  const d = inputDir(), sp = PLAYER_SPEED * k, r = 17;
  P.moving = d.dx !== 0 || d.dy !== 0;
  if (P.moving) { P.bob += 0.25 * k; P.angle = Math.atan2(d.dy, d.dx); }
  const nx = P.x + d.dx * sp;
  if (!walls.some(w => circleHitsRect(nx, P.y, r, w))) P.x = nx;
  const ny = P.y + d.dy * sp;
  if (!walls.some(w => circleHitsRect(P.x, ny, r, w))) P.y = ny;
  P.x = Math.max(r, Math.min(VW - r, P.x));
  P.y = Math.max(r, Math.min(VH - r, P.y));
}
function drawPerson(g) {
  const swing = P.moving ? Math.sin(P.bob) * 4 : 0;
  g.save();
  g.fillStyle = "rgba(0,0,0,0.3)"; g.beginPath(); g.ellipse(P.x + 5, P.y + 6, 20, 15, 0, 0, 7); g.fill();
  g.translate(P.x, P.y); g.scale(1.35, 1.35); g.rotate(P.angle + Math.PI / 2);   // the person faces where they walk
  g.fillStyle = P.suit ? "#d8dde3" : "#34445c";                  // legs
  g.fillRect(-7, 2 + swing, 6, 10); g.fillRect(1, 2 - swing, 6, 10);
  if (P.suit) { g.fillStyle = "#b9c0c8"; g.fillRect(-8, 2, 16, 12); }  // backpack
  g.fillStyle = P.suit ? "#f2f4f7" : PLAYER_SHIRT;                // body
  g.beginPath(); g.ellipse(0, 0, 14, 8, 0, 0, 7); g.fill();
  g.fillStyle = P.suit ? "#f2f4f7" : "#f1c9a0";                   // arms
  g.beginPath(); g.arc(-14, swing, 4.5, 0, 7); g.fill();
  g.beginPath(); g.arc(14, -swing, 4.5, 0, 7); g.fill();
  if (P.helmet) {                                                // helmet
    g.fillStyle = "#f7f9fb"; g.beginPath(); g.arc(0, -1, 11, 0, 7); g.fill();
    const vg = g.createLinearGradient(-7, -10, 7, -2); vg.addColorStop(0, "#7fc4ff"); vg.addColorStop(1, "#1b3d6e");
    g.fillStyle = vg; g.beginPath(); g.ellipse(0, -5, 7, 4.5, 0, 0, 7); g.fill();
  } else {                                                       // head and hair
    g.fillStyle = "#f1c9a0"; g.beginPath(); g.arc(0, -1, 8, 0, 7); g.fill();
    g.fillStyle = "#4a2f1d"; g.beginPath(); g.arc(0, 1, 8.5, 0, Math.PI); g.fill();
  }
  g.restore();
}

// ----- a car seen from above (it faces up) -----
function drawCar(g, cx, cy, w, h, col) {
  g.save(); g.translate(cx, cy);
  g.fillStyle = "rgba(0,0,0,0.3)"; g.beginPath(); g.roundRect(-w / 2 + 5, -h / 2 + 7, w, h, 12); g.fill();
  g.fillStyle = "#111";
  [[-w / 2 - 3, -h * 0.3], [w / 2 - 3, -h * 0.3], [-w / 2 - 3, h * 0.17], [w / 2 - 3, h * 0.17]].forEach(p => g.fillRect(p[0], p[1], 6, h * 0.2));
  const bg = g.createLinearGradient(-w / 2, 0, w / 2, 0);
  bg.addColorStop(0, col); bg.addColorStop(0.5, "rgba(255,255,255,0.35)"); bg.addColorStop(1, col);
  g.fillStyle = col; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 12); g.fill();
  g.fillStyle = bg; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 12); g.fill();
  g.strokeStyle = "rgba(0,0,0,0.5)"; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = "#1f3447";
  g.beginPath(); g.roundRect(-w / 2 + 6, -h * 0.24, w - 12, h * 0.15, 4); g.fill();     // front window
  g.beginPath(); g.roundRect(-w / 2 + 6, h * 0.16, w - 12, h * 0.12, 4); g.fill();      // back window
  g.fillStyle = "rgba(255,255,255,0.28)"; g.beginPath(); g.roundRect(-w / 2 + 8, -h * 0.07, w - 16, h * 0.22, 5); g.fill();  // roof
  g.fillStyle = "#fff3b0"; g.fillRect(-w / 2 + 5, -h / 2 + 2, 9, 5); g.fillRect(w / 2 - 14, -h / 2 + 2, 9, 5);   // headlights
  g.fillStyle = "#d62828"; g.fillRect(-w / 2 + 5, h / 2 - 6, 9, 4); g.fillRect(w / 2 - 14, h / 2 - 6, 9, 4);     // tail lights
  g.restore();
}

function drawTree(g, tx, ty, r) {
  g.fillStyle = "rgba(0,0,0,0.25)"; g.beginPath(); g.arc(tx + 6, ty + 8, r, 0, 7); g.fill();
  g.fillStyle = "#2f7d32"; g.beginPath(); g.arc(tx, ty, r, 0, 7); g.fill();
  g.fillStyle = "#3f9a43"; g.beginPath(); g.arc(tx - r * 0.25, ty - r * 0.25, r * 0.65, 0, 7); g.fill();
  g.fillStyle = "#5bb85f"; g.beginPath(); g.arc(tx - r * 0.4, ty - r * 0.4, r * 0.28, 0, 7); g.fill();
}

function makeHouse(done) {
  P.x = 235; P.y = 285; P.angle = Math.PI / 2; P.suit = false; P.helmet = false;
  const trees = [[520, 110, 36], [900, 120, 40], [110, 400, 40], [300, 520, 34], [470, 440, 30]];

  const walls = [{ x: 70, y: 40, w: 330, h: 200 }, carRect].concat(trees.map(t => ({ x: t[0] - t[2] * 0.6, y: t[1] - t[2] * 0.6, w: t[2] * 1.2, h: t[2] * 1.2 })));
  const R = rng(5);
  const bg = offscreen(g => {
    g.fillStyle = "#4f9d4a"; g.fillRect(0, 0, VW, VH);
    for (let i = 0; i < 700; i++) { g.fillStyle = R() > 0.5 ? "#5aab54" : "#43893f"; g.fillRect(R() * VW, R() * VH, 3, 8); }
    g.fillStyle = "#6d6f73"; g.fillRect(560, 320, 300, 280);                         // driveway
    g.strokeStyle = "rgba(255,255,255,0.5)"; g.lineWidth = 3; g.strokeRect(575, 335, 270, 250);
    g.fillStyle = "#d4cbb8"; g.fillRect(212, 240, 46, 80); g.fillRect(212, 290, 360, 40);   // path
    g.fillStyle = "#9c3d32"; g.fillRect(70, 40, 330, 200);                            // roof
    for (let yy = 40; yy < 240; yy += 14) { g.strokeStyle = "rgba(0,0,0,0.2)"; g.beginPath(); g.moveTo(70, yy); g.lineTo(400, yy); g.stroke(); }
    g.fillStyle = "rgba(0,0,0,0.18)"; g.fillRect(235, 40, 165, 200);
    g.strokeStyle = "#e8b9a8"; g.lineWidth = 4; g.beginPath(); g.moveTo(235, 40); g.lineTo(235, 240); g.stroke();
    g.strokeStyle = "#4a1c16"; g.lineWidth = 3; g.strokeRect(70, 40, 330, 200);
    g.fillStyle = "#7a4a3a"; g.fillRect(330, 62, 34, 34);                              // chimney
    g.fillStyle = "#c9b79a"; g.fillRect(203, 240, 64, 22);                             // porch
    g.fillStyle = "#6b3f24"; g.fillRect(220, 236, 30, 8);                              // door
    for (let i = 0; i < 40; i++) { g.fillStyle = ["#ff6b9d", "#ffd23f", "#ffffff", "#c77dff"][i % 4]; g.beginPath(); g.arc(60 + R() * 360, 250 + R() * 20, 3, 0, 7); g.fill(); }
    trees.forEach(t => drawTree(g, t[0], t[1], t[2]));
  });
  let finished = false;
  return {
    hud: "Walk to your car!  (arrow keys or WASD. On a touch screen, hold your finger where you want to go.)",
    update(dt, k) {
      movePlayer(k, walls);
      if (!finished && circleHitsRect(P.x, P.y, 13 + 18, carRect)) { finished = true; done(); }
    },

      drawPerson(g);

}

// ----- chapters 2 and 8: driving (to NASA, and back home) -----
function makeDrive(dest, done) {
  const roadL = 300, roadR = 700;
  let dist = 0, scroll = 0, bump = 0, spawn = 0, finished = false;
  const car = { x: 500, y: 470 };
  let obstacles = [];
  const trees = [];
  for (let i = 0; i < 16; i++) trees.push({ x: i % 2 ? 40 + Math.random() * 220 : 740 + Math.random() * 220, y: Math.random() * VH, r: 22 + Math.random() * 16 });
  const colours = ["#2a6fdb", "#f4a261", "#8d99ae", "#2a9d8f", "#9b5de5"];
  return {
    hud: "Drive to " + (dest === "nasa" ? "NASA" : "your house") + "!  Steer left and right.",
    update(dt, k) {
      if (finished) return;
      const slow = bump > 0 ? 0.4 : 1;
      bump = Math.max(0, bump - dt);
      const sp = 6 * k * slow;
      scroll += sp;
      dist += dt / 1000 / DRIVE_SECONDS * slow;
      let steer = 0;
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) steer -= 1;
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) steer += 1;
      if (steer) car.x += steer * 8 * k;
      else if (ptr.down) car.x += Math.max(-8 * k, Math.min(8 * k, ptr.x - car.x));
      car.x = Math.max(roadL + 36, Math.min(roadR - 36, car.x));
      spawn += dt;
      if (spawn > 1100 && dist < 0.88) {
        spawn = 0;
        const cone = Math.random() < 0.4;
        obstacles.push({ cone, x: roadL + 50 + Math.random() * (roadR - roadL - 100), y: -120, w: cone ? 26 : 56, h: cone ? 30 : 100, col: colours[Math.floor(Math.random() * colours.length)] });
      }
      for (const o of [...obstacles]) {
        o.y += sp * (o.cone ? 1 : 0.55);
        if (Math.abs(car.x - o.x) < (56 + o.w) / 2 - 8 && Math.abs(car.y - o.y) < (100 + o.h) / 2 - 8) { bump = 900; obstacles = obstacles.filter(q => q !== o); }
        else if (o.y > VH + 150) obstacles = obstacles.filter(q => q !== o);
      }
      sceneHud.textContent = this.hud + "   " + Math.min(100, Math.round(dist * 100)) + "%";
      if (dist >= 1) { finished = true; done(); }
    },
    draw(g, t) {
      g.fillStyle = "#4f9d4a"; g.fillRect(0, 0, VW, VH);
      trees.forEach(tr => drawTree(g, tr.x, ((tr.y + scroll * 0.9) % (VH + 100)) - 50, tr.r));
      g.fillStyle = "#44484f"; g.fillRect(roadL, 0, roadR - roadL, VH);               // road
      g.fillStyle = "#f4f4f4"; g.fillRect(roadL, 0, 6, VH); g.fillRect(roadR - 6, 0, 6, VH);
      for (let yy = -80 + (scroll % 80); yy < VH; yy += 80) { g.fillRect(432, yy, 8, 40); g.fillRect(560, yy, 8, 40); }
      obstacles.forEach(o => {
        if (o.cone) {
          g.fillStyle = "#ff7a00"; g.beginPath(); g.moveTo(o.x, o.y - 15); g.lineTo(o.x + 13, o.y + 15); g.lineTo(o.x - 13, o.y + 15); g.fill();
          g.fillStyle = "#fff"; g.fillRect(o.x - 7, o.y + 2, 14, 4);
        } else drawCar(g, o.x, o.y, o.w, o.h, o.col);
      });
      if (dist > 0.9) {                                                                 // the gate comes closer
        const gy = -60 + (dist - 0.9) / 0.1 * (car.y - 20 + 60);
        g.fillStyle = "#1d3f7a"; g.fillRect(roadL - 30, gy - 40, roadR - roadL + 60, 50);
        g.fillStyle = "#fff"; g.fillRect(roadL - 30, gy - 40, 16, 120); g.fillRect(roadR + 14, gy - 40, 16, 120);
        label(g, dest === "nasa" ? "NASA" : "HOME", 500, gy - 15, 34, "#fff");
      }
      drawCar(g, car.x, car.y, 56, 100, CAR_COLOUR);
      if (bump > 0) label(g, "Bump!", car.x, car.y - 70, 24, "#ffd23f");
    }
  };
}

// ----- chapter 5 (and the planets): walking on a planet or the Moon -----
const THEMES = {
  station: { title: "the Space Station", ground: "#3d4857", ground2: "#566275", item: "#5dff9a", name: "energy cell", count: 4 },
  ring:    { title: "the Ring Planet",   ground: "#c9a56b", ground2: "#a9854e", item: "#ffd23f", name: "gold crystal", count: 4 },
  red:     { title: "the Red Planet",    ground: "#a8452c", ground2: "#7d301c", item: "#7df9ff", name: "blue crystal", count: 4 },
  moon:    { title: "the Moon",          ground: "#a9a9a5", ground2: "#82827e", item: "#f1f1ea", name: "moon rock",    count: 3, flag: true }
};
function makeSurface(key, done) {
  const T = THEMES[key], R = rng(31 + key.length);
  const rocketSpot = { x: 500, y: 300 };
  const rocketWall = { x: 478, y: 250, w: 44, h: 100 };
  const items = [];
  while (items.length < T.count) {
    const ix = 90 + R() * 820, iy = 80 + R() * 440;
    if (Math.hypot(ix - 500, iy - 300) > 130 && items.every(o => Math.hypot(o.x - ix, o.y - iy) > 120)) items.push({ x: ix, y: iy, got: false });
  }
  const flag = { x: 830, y: 150, planted: false };
  P.x = 500; P.y = 430; P.angle = -Math.PI / 2; P.suit = true; P.helmet = true;
  const bg = offscreen(g => {
    g.fillStyle = T.ground; g.fillRect(0, 0, VW, VH);
    for (let i = 0; i < 26; i++) { g.fillStyle = T.ground2; g.globalAlpha = 0.45; g.beginPath(); g.ellipse(R() * VW, R() * VH, 40 + R() * 90, 20 + R() * 50, R() * 3, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    if (key === "station") {
      g.strokeStyle = "rgba(255,255,255,0.12)"; g.lineWidth = 2;
      for (let i = 0; i < VW; i += 50) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, VH); g.stroke(); }
      for (let j = 0; j < VH; j += 50) { g.beginPath(); g.moveTo(0, j); g.lineTo(VW, j); g.stroke(); }
    } else {
      for (let i = 0; i < 30; i++) {
        const cx = R() * VW, cy = R() * VH, cr = 8 + R() * 28;
        g.fillStyle = "rgba(0,0,0,0.22)"; g.beginPath(); g.arc(cx, cy, cr, 0, 7); g.fill();
        g.strokeStyle = "rgba(255,255,255,0.28)"; g.lineWidth = 2; g.beginPath(); g.arc(cx + 1, cy + 1, cr, 0.3, 2.5); g.stroke();
      }
      for (let i = 0; i < 60; i++) { g.fillStyle = "rgba(0,0,0,0.25)"; g.beginPath(); g.arc(R() * VW, R() * VH, 2 + R() * 4, 0, 7); g.fill(); }
    }
  });
  let finished = false;
  const got = () => items.filter(i => i.got).length;
  const allDone = () => got() === T.count && (!T.flag || flag.planted);
  toast("Welcome to " + T.title + "!");
  return {
    hud: "", items, flag,
    update(dt, k) {
      movePlayer(k, [rocketWall]);
      items.forEach(it => {
        if (!it.got && Math.hypot(P.x - it.x, P.y - it.y) < 28) { it.got = true; score += CRYSTAL_SCORE; toast("+" + CRYSTAL_SCORE + "  You found a " + T.name + "!"); }
      });
      if (T.flag && got() === T.count && !flag.planted && Math.hypot(P.x - flag.x, P.y - flag.y) < 34) { flag.planted = true; score += 100; toast("You planted the flag on the Moon!  +100"); }
      sceneHud.textContent = (allDone() ? "All done! Walk to your rocket to go on." :
        (T.flag && got() === T.count ? "Plant the flag on the glowing spot!" : "Find the " + T.name + "s: " + got() + " / " + T.count + "   (score " + score + ")")) +
        (key === "moon" ? "" : "   You can leave any time: walk to the rocket.");
      const nearRocket = Math.hypot(P.x - rocketSpot.x, P.y - rocketSpot.y) < 80;
      if (!finished && nearRocket && (!T.flag || allDone())) { finished = true; if (got() === T.count) score += 100; done(); }
      else if (nearRocket && T.flag && !allDone()) sceneHud.textContent = "You have to collect the rocks and plant the flag first!";
    },
    draw(g, t) {
      g.drawImage(bg, 0, 0);
      g.drawImage(IMG.rocket, 440, 220, 120, 120);
      items.forEach(it => {
        if (it.got) return;
        const pulse = 0.5 + 0.5 * Math.sin(t / 300 + it.x);
        g.fillStyle = T.item; g.globalAlpha = 0.25 + pulse * 0.3; g.beginPath(); g.arc(it.x, it.y, 26, 0, 7); g.fill(); g.globalAlpha = 1;
        g.fillStyle = T.item; g.strokeStyle = "rgba(0,0,0,0.4)"; g.lineWidth = 2;
        g.beginPath();
        if (key === "moon") { g.arc(it.x, it.y, 11, 0, 7); }
        else { g.moveTo(it.x, it.y - 15); g.lineTo(it.x + 10, it.y); g.lineTo(it.x, it.y + 15); g.lineTo(it.x - 10, it.y); g.closePath(); }
        g.fill(); g.stroke();
      });
      if (T.flag && got() === T.count) {
        if (!flag.planted) { g.fillStyle = "rgba(255,230,80," + (0.3 + 0.2 * Math.sin(t / 200)) + ")"; g.beginPath(); g.arc(flag.x, flag.y, 34, 0, 7); g.fill(); }
        else {
          g.strokeStyle = "#ddd"; g.lineWidth = 4; g.beginPath(); g.moveTo(flag.x, flag.y + 20); g.lineTo(flag.x, flag.y - 34); g.stroke();
          g.fillStyle = "#e63946"; g.fillRect(flag.x, flag.y - 34, 38, 16); g.fillStyle = "#1d3f7a"; g.fillRect(flag.x, flag.y - 34, 14, 16);
        }
      }
      drawPerson(g);
    }
  };
}

// ----- the last chapter: the parking lot with 5 levels -----
function makeGarage(targetFloor, done) {
  const base = f => 520 - f * 95;                       // how high floor f is
  const pts = [{ x: 300, y: base(0) }];
  for (let f = 0; f < targetFloor; f++) {
    const edge = f % 2 === 0 ? 690 : 310;
    pts.push({ x: edge, y: base(f) }); pts.push({ x: edge, y: base(f + 1) });
  }
  pts.push({ x: targetFloor % 2 === 0 ? 560 : 440, y: base(targetFloor) });
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const len = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); segs.push(len); total += len; }
  let travelled = 0, finished = false, dir = 1;
  const R = rng(3);
  return {
    hud: "Driving home...",
    update(dt, k) {
      if (finished) return;
      travelled = Math.min(total, travelled + dt / 1000 * 230);
      if (travelled >= total) {
        finished = true;
        showSceneMsg("You are home!<br>You parked on <b>Level " + (targetFloor + 1) + "</b> of 5<br><span style='font-size:22px'>Score: " + score + "   Best: " + best + "</span>", "Play again", done);
      }
    },
    draw(g, t) {
      const sky = g.createLinearGradient(0, 0, 0, VH); sky.addColorStop(0, "#142a5c"); sky.addColorStop(1, "#e9a46a");
      g.fillStyle = sky; g.fillRect(0, 0, VW, VH);
      g.fillStyle = "#2c3e2f"; g.fillRect(0, 530, VW, 70);                                     // ground
      g.fillStyle = "#e8d7b8"; g.fillRect(70, 430, 170, 100);                                  // your house
      g.fillStyle = "#9c3d32"; g.beginPath(); g.moveTo(55, 430); g.lineTo(155, 360); g.lineTo(255, 430); g.fill();
      g.fillStyle = "#6b3f24"; g.fillRect(140, 470, 30, 60); g.fillStyle = "#bfe4ff"; g.fillRect(90, 455, 34, 30); g.fillRect(185, 455, 34, 30);
      label(g, "HOME", 155, 410, 18, "#fff");
      g.fillStyle = "#555a62"; g.fillRect(270, 60, 460, 470);                                  // building
      g.fillStyle = "#3a3e45"; g.fillRect(270, 60, 460, 24);
      label(g, "PARKING  -  5 LEVELS", 500, 72, 16, "#ffd23f");
      for (let f = 0; f < 5; f++) {
        const fy = base(f);
        g.fillStyle = "#2a2d33"; g.fillRect(285, fy - 82, 430, 82);                            // dark room behind the cars
        g.strokeStyle = "rgba(255,255,255,0.35)"; g.lineWidth = 2;
        for (let i = 0; i < 7; i++) { g.beginPath(); g.moveTo(350 + i * 52, fy - 4); g.lineTo(350 + i * 52, fy - 30); g.stroke(); }
        label(g, "LEVEL " + (f + 1), 335, fy - 62, 15, f === targetFloor ? "#ffd23f" : "#9aa");
        g.fillStyle = "#9a9da3"; g.fillRect(270, fy + 2, 460, 11);                              // floor slab
        const edge = f % 2 === 0 ? 690 : 310;                                                    // ramp up to the next floor
        if (f < 4) { g.fillStyle = "#7d8087"; g.beginPath(); g.moveTo(edge - 30, fy + 2); g.lineTo(edge + 30, fy - 94 + 13); g.lineTo(edge + 30, fy + 2); g.fill(); }
      }
      const parked = travelled >= total;
      let cx = pts[0].x, cy = pts[0].y, d = travelled;
      for (let i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { const u = Math.min(1, d / (segs[i] || 1)); cx = pts[i].x + (pts[i + 1].x - pts[i].x) * u; cy = pts[i].y + (pts[i + 1].y - pts[i].y) * u; if (pts[i + 1].x !== pts[i].x) dir = pts[i + 1].x > pts[i].x ? 1 : -1; break; }
        d -= segs[i];
      }
      this.drawSideCar(g, cx, cy, dir);
      if (parked) { g.fillStyle = "#ffd23f"; g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 9 : 22; g.lineTo(cx + Math.cos(a) * r, cy - 80 + Math.sin(a) * r); } g.fill(); }
    },
    drawSideCar(g, cx, cy, dir) {
      g.save(); g.translate(cx, cy); g.scale(dir, 1);
      g.fillStyle = CAR_COLOUR; g.beginPath(); g.roundRect(-36, -28, 72, 20, 7); g.fill();
      g.beginPath(); g.roundRect(-20, -44, 40, 20, 8); g.fill();
      g.fillStyle = "#cfe8ff"; g.beginPath(); g.roundRect(-16, -41, 15, 13, 3); g.fill(); g.beginPath(); g.roundRect(2, -41, 15, 13, 3); g.fill();
      g.fillStyle = "#fff3b0"; g.fillRect(32, -24, 6, 6);
      g.fillStyle = "#111"; g.beginPath(); g.arc(-21, -8, 9, 0, 7); g.arc(21, -8, 9, 0, 7); g.fill();
      g.fillStyle = "#aaa"; g.beginPath(); g.arc(-21, -8, 4, 0, 7); g.arc(21, -8, 4, 0, 7); g.fill();
      g.restore();
    }
  };
}

// ----- the story, one chapter after another -----
function newStory() {
  score = 0; landed = 0;
  startHouse();
}
function startHouse() { goMode("house"); scene = makeHouse(() => startDrive("nasa")); sceneHud.textContent = scene.hud; }
function startDrive(dest) {
  goMode("drive");
  scene = makeDrive(dest, () => { if (dest === "nasa") startNasa(false); else startGarage(); });
  sceneHud.textContent = scene.hud;
}
function startNasa(back) {
  goMode("nasa");
  scene = makeNasa(back, () => { if (back) startDrive("home"); else startFlight("out"); });
  sceneHud.textContent = scene.hud;
  toast(back ? "You landed safely at NASA!" : "Welcome to NASA!");
}
function startSurface(key, after) {
  goMode("surface");
  scene = makeSurface(key, after);
}
function startGarage() {
  const floor = Math.min(4, landed + (score >= GARAGE_BIG_SCORE ? 1 : 0));   // 0 = Level 1 ... 4 = Level 5
  if (score > best) { best = score; try { localStorage.setItem("rocketBest", String(best)); } catch (e) {} }
  goMode("garage");
  scene = makeGarage(floor, newStory);
  sceneHud.textContent = scene.hud;
}

// =====================================================
//  THE FLIGHT  -  the rocket game
// =====================================================
function startFlight(kind) {
  things.forEach(t => t.el.remove());
  planets.forEach(p => p.el.remove());
  things = []; planets = [];
  const out = kind === "out";
  trip = out ? {
    kind, levels: LEVELS, secs: SECONDS_PER_LEVEL, goal: "the Moon", goalPic: PIC.moon, places: PLACES_OUT,
    stops: [
      { at: 0.25, name: "the Space Station", theme: "station", pic: PIC.station,    size: 150, done: false },
      { at: 0.5,  name: "the Ring Planet",   theme: "ring",    pic: PIC.planets[0], size: 260, done: false },
      { at: 0.75, name: "the Red Planet",    theme: "red",     pic: PIC.planets[1], size: 260, done: false }
    ]
  } : {
    kind, levels: RETURN_LEVELS, secs: RETURN_SECONDS_PER_LEVEL, goal: "Earth", goalPic: PIC.planets[2], places: PLACES_BACK, stops: []
  };
  trip.scoreAtStart = score;
  trip.offer = null;
  progress = 0; level = 1; paused = false; playing = true;
  lives = easy ? EASY_LIVES : START_LIVES;
  boostUntil = 0; boostReadyAt = 0; shieldUntil = 0; shieldReadyAt = 0;
  rockTimer = alienTimer = starTimer = planetTimer = 0;
  x = window.innerWidth / 2 - ROCKET_SIZE / 2;
  y = window.innerHeight - ROCKET_SIZE * 1.6;
  rocket.style.left = x + "px"; rocket.style.top = y + "px";
  moon.style.display = "none";
  moon.style.backgroundImage = "url(" + trip.goalPic + ")";
  message.innerHTML = "";
  goMode("flight");
  showHud();
  showBanner(out ? "Blast off!" : "Heading home!");
}

// A planet to land on is coming up! Press L (or the green button) to land.
function landNow() {
  if (!inFlight() || !trip.offer) return;
  const stop = trip.offer;
  stop.done = true; trip.offer = null;
  things.forEach(t => t.el.remove()); things = [];
  landed++;
  startSurface(stop.theme, () => { goMode("flight"); showBanner("Back in space!"); });
}

function flightOver() {            // out of hull blocks
  playing = false;
  message.innerHTML = "Game over!<br>" + (ROCKET_NAME || "Your rocket") + " was " + kmLeft().toLocaleString() + " km from " + trip.goal +
                      "<br>Score: " + score + "<br><button id='again'>Try this flight again</button>";
  document.getElementById("again").addEventListener("click", () => { score = trip.scoreAtStart; startFlight(trip.kind); });
}

function flightDone() {            // we got there!
  playing = false;
  mapEl.style.display = "none";
  if (trip.kind === "out") {
    startSurface("moon", () => startFlight("back"));
  } else {
    startNasa(true);
  }
}

// ---------- The game loop: runs 60 times a second ----------
function frame(now) {
  const dt = Math.min(now - last, 50);   // time since last frame (ms)
  last = now;
  const k = dt / 16.67;                  // 1 when the game runs smoothly

  if (mode === "flight") {
    const running = playing && !paused;
    drawStars(paused ? 0 : k, running);
    if (running) update(dt, k);

    // The buttons show if they are ready
    const t0 = performance.now();
    if (boosting()) { boostBtn.textContent = "BOOSTING!"; boostBtn.className = "on"; }
    else if (t0 < boostReadyAt) { boostBtn.textContent = "Wait " + Math.ceil((boostReadyAt - t0) / 1000) + "s"; boostBtn.className = "cooling"; }
    else { boostBtn.textContent = "BOOST (B)"; boostBtn.className = ""; }
    if (shielding()) { shieldBtn.textContent = "SHIELD " + Math.ceil((shieldUntil - t0) / 1000) + "s"; shieldBtn.className = "on"; }
    else if (t0 < shieldReadyAt) { shieldBtn.textContent = "Wait " + Math.ceil((shieldReadyAt - t0) / 1000) + "s"; shieldBtn.className = "cooling"; }
    else { shieldBtn.textContent = "SHIELD (S)"; shieldBtn.className = ""; }
    if (!shielding()) shieldEl.style.display = "none";
    landBtn.style.display = trip && trip.offer && running ? "block" : "none";
  } else {
    drawWorld(now, dt, k);
  }
  requestAnimationFrame(frame);   // do it again, 60 times a second!
}

function drawWorld(now, dt, k) {
  const w = window.innerWidth, h = window.innerHeight;
  if (worldCanvas.width !== w || worldCanvas.height !== h) { worldCanvas.width = w; worldCanvas.height = h; }
  view.s = Math.min(w / VW, h / VH);
  view.ox = (w - VW * view.s) / 2; view.oy = (h - VH * view.s) / 2;
  wg.setTransform(1, 0, 0, 1, 0, 0);
  wg.fillStyle = "#000"; wg.fillRect(0, 0, w, h);
  wg.setTransform(view.s, 0, 0, view.s, view.ox, view.oy);
  wg.save(); wg.beginPath(); wg.rect(0, 0, VW, VH); wg.clip();
  if (scene) {
    if (!waitingStart) scene.update(dt, k);
    scene.draw(wg, now);
  }
  wg.restore();
}

function update(dt, k) {
  // Fly the rocket
  const speed = rocketSpeed() * k;
  if (keys["ArrowLeft"])  x -= speed;
  if (keys["ArrowRight"]) x += speed;
  if (keys["ArrowUp"])    y -= speed;
  if (keys["ArrowDown"])  y += speed;
  x = Math.max(0, Math.min(window.innerWidth  - ROCKET_SIZE, x));
  y = Math.max(0, Math.min(window.innerHeight - ROCKET_SIZE, y));
  rocket.style.left = x + "px";
  rocket.style.top  = y + "px";
  if (boosting() !== rocketLooksBoosted) {              // big flame when boosting
    rocketLooksBoosted = boosting();
    setPicture(rocket, rocketLooksBoosted ? PIC.rocketBoost : PIC.rocket);
  }

  // The journey: we get closer to the goal!
  progress += dt / 1000 / (trip.levels * trip.secs) * (boosting() ? BOOST_POWER : 1);
  const newLevel = Math.min(trip.levels, Math.floor(progress * trip.levels) + 1);
  if (newLevel > level) {
    level = newLevel;
    score += LEVEL_SCORE;
    showBanner("Level " + level + "!  Faster!");
  }
  // The Moon (or Earth) grows as we get close
  if (progress > 0.82) {
    const goalSize = 40 + Math.min(1, (progress - 0.82) / 0.18) * 280;
    moon.style.display = "block";
    moon.style.width = moon.style.height = goalSize + "px";
  }
  if (progress >= 1) { progress = 1; showHud(); flightDone(); return; }

  // A planet to land on?
  if (!trip.offer) {
    const stop = trip.stops.find(s => !s.done);
    if (stop && progress >= stop.at) {
      trip.offer = stop; stop.offerUntil = performance.now() + 9000;
      landBtn.innerHTML = "<img src='" + stop.pic + "'> Land on " + stop.name + "! (L)";
      makePlanet(stop.pic, stop.size, window.innerWidth / 2 - stop.size / 2, 1.2);
    }
  } else if (performance.now() > trip.offer.offerUntil) {
    trip.offer.done = true; trip.offer = null;
  }

  // New rocks, stars, aliens and planets
  rockTimer += dt; alienTimer += dt; starTimer += dt; planetTimer += dt;
  const fewer = easy ? EASY_FEWER : 1;
  if (rockTimer  > ROCK_EVERY  * fewer / tough()) {
    rockTimer = 0;
    makeThing("rock", PIC.rocks[Math.floor(Math.random() * PIC.rocks.length)], randomX(), -SIZE, ROCK_SPEED * tough() * mean(), SIZE);
  }
  if (alienTimer > ALIEN_EVERY * fewer / tough()) { alienTimer = 0; makeThing("alien", PIC.alien, randomX(), -SIZE, ALIEN_SPEED * tough() * mean(), SIZE); }
  if (starTimer  > STAR_EVERY)                    { starTimer = 0;  makeThing("star",  PIC.star,  randomX(), -SIZE, 3, SIZE); }
  if (planetTimer > 5000)                         { planetTimer = 0; makePlanet(); }

  // Planets drift past
  for (const p of [...planets]) {
    p.y += p.speed * k;
    p.el.style.left = p.x + "px";
    p.el.style.top  = p.y + "px";
    if (p.y > window.innerHeight) { p.el.remove(); planets = planets.filter(o => o !== p); }
  }

  // Where is my rocket? (a box around the body)
  let me = { x: x + ROCKET_SIZE * 0.3, y: y + ROCKET_SIZE * 0.05, w: ROCKET_SIZE * 0.4, h: ROCKET_SIZE * 0.75 };
  const shielded = shielding();
  if (shielded) {                                       // the shield bubble is bigger than the rocket
    const bubble = ROCKET_SIZE * 1.7;
    shieldEl.style.display = "block";
    shieldEl.style.width = shieldEl.style.height = bubble + "px";
    shieldEl.style.left = x + ROCKET_SIZE / 2 - bubble / 2 + "px";
    shieldEl.style.top  = y + ROCKET_SIZE / 2 - bubble / 2 + "px";
    shieldEl.style.opacity = shieldUntil - performance.now() < 3000 && Math.floor(performance.now() / 150) % 2 ? 0.35 : 1;  // blinks when it's about to run out
    const r = ROCKET_SIZE * 0.7;
    me = { x: x + ROCKET_SIZE / 2 - r, y: y + ROCKET_SIZE / 2 - r, w: r * 2, h: r * 2 };
  }

  for (const t of [...things]) {
    if (t.kind === "alien") {
      // Alien ships fly straight at the rocket!
      const dx = x - t.x, dy = y - t.y;
      const dist = Math.hypot(dx, dy) || 1;
      t.x += dx / dist * t.speed * k;
      t.y += dy / dist * t.speed * k;
    } else {
      t.y += t.speed * k;
    }
    t.el.style.left = t.x + "px";
    t.el.style.top  = t.y + "px";

    if (t.y > window.innerHeight || t.y < -100) { removeThing(t); continue; }

    const box = boxOf(t.x, t.y, t.size, t.kind === "bullet" ? 0.1 : 0.15);
    if (t.kind === "rock" && touching(me, box)) {
      removeThing(t);
      if (!shielded) loseLife(easy ? EASY_DAMAGE : ROCK_DAMAGE);     // ouch, rocks hurt! (but not with a shield)
    }
    else if (t.kind === "alien" && touching(me, box)) {
      removeThing(t);
      if (!shielded) loseLife(1);                                    // ouch! (but not with a shield)
    }
    else if (t.kind === "star" && touching(me, box)) {
      removeThing(t); score += STAR_SCORE; showHud();                // got a star!
    }
    else if (t.kind === "bullet") {
      for (const a of things.filter(o => o.kind === "alien")) {
        if (touching(box, boxOf(a.x, a.y, a.size, 0.1))) {           // shot an alien ship!
          removeThing(a); removeThing(t); score += ALIEN_SCORE; showHud();
          break;
        }
      }
    }
    if (!playing) return;
  }
  showHud();
}

// ---------- Start screen ----------
goMode("house");
scene = makeHouse(() => startDrive("nasa"));
showButtons();
showSceneMsg("<h1 style='margin:0'>Moon Mission</h1><div style='font-size:22px;margin:10px 0'>Walk to your car, drive to NASA, fly to the Moon and come home again!</div>" +
             "<div style='font-size:18px;color:#bcd;margin-bottom:6px'>Walk: arrow keys / WASD, or touch and hold<br>Rocket: arrows or mouse &middot; Space = shoot &middot; B = boost &middot; S = shield &middot; M = map &middot; L = land &middot; E = easy</div>",
             "Start the mission!", () => { waitingStart = false; sceneHud.textContent = scene.hud; });
last = performance.now();
requestAnimationFrame(frame);
</script>
</body>
